---
- name: Hiddify Configure | Render panel config
  template:
    src: hiddify-panel.env.j2
    dest: "{{ hiddify_config_dir }}/panel.env"
    mode: '0600'
  notify: "reload hiddify config"

- name: Hiddify Configure | Render Docker compose
  template:
    src: docker-compose.yml.j2
    dest: "{{ hiddify_base_dir }}/docker-compose.yml"
    mode: '0644'

- name: Hiddify Configure | Set admin password (secure)
  copy:
    content: "{{ hiddify_panel_admin_password }}"
    dest: "{{ hiddify_config_dir }}/.admin_password"
    mode: '0600'
  no_log: true
  when: hiddify_remote_execution_enabled | bool

- name: Hiddify Configure | Admin password placeholder (offline)
  debug:
    msg: "Admin password stored at {{ hiddify_config_dir }}/.admin_password (OFFLINE — not written)"
  when: not (hiddify_remote_execution_enabled | bool)
