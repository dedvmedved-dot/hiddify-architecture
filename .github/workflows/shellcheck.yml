name: ShellCheck

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.sh'
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.sh'

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Find shell scripts
        id: find-scripts
        run: |
          scripts=$(find . -type f -name "*.sh" -not -path "./.git/*" || true)
          if [ -z "$scripts" ]; then
            echo "No shell scripts found, skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "scripts<<EOF" >> $GITHUB_OUTPUT
            echo "$scripts" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Run ShellCheck
        if: steps.find-scripts.outputs.skip != 'true'
        run: |
          find . -type f -name "*.sh" -not -path "./.git/*" -exec shellcheck {} +
