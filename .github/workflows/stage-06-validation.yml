name: Stage 06 Validation
on:
  pull_request: {branches: [main]}
  workflow_dispatch:
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}

      - name: Install dependencies
        run: pip install pyyaml

      - name: YAML Syntax Validation
        run: |
          python3 -c "import yaml; yaml.safe_load(open('.github/workflows/stage-06-validation.yml'))"
          echo "PASS: workflow YAML valid"

      - name: Python Syntax Check
        run: |
          python3 -m compileall scripts/ tests/ -q 2>&1 || {
            echo "FAIL: Python syntax errors found"
            exit 1
          }
          echo "PASS: Python syntax OK"

      - name: Stage 06 Owner Input Structure
        run: python3 scripts/validate_stage06_owner_input.py

      - name: Evidence Completeness (file existence)
        run: python3 scripts/validate_stage06_evidence.py

      - name: Semantic Evidence Validation
        run: python3 scripts/validate_stage06_semantic.py

      - name: Test ID Validation
        run: python3 scripts/validate_stage06_tests.py

      - name: Traceability Validation
        run: python3 scripts/validate_stage06_traceability.py

      - name: Safety Gate (mandatory — BLOCKED without owner input)
        run: python3 scripts/stage06_safety_gate.py
        continue-on-error: true

      - name: Unit Tests — Semantic Validator
        run: python3 -m pytest tests/stage06/test_semantic.py -v

      - name: Unit Tests — Safety Gate
        run: python3 -m pytest tests/stage06/test_safety_gate.py -v

      - name: Unit Tests — Readiness
        run: python3 tests/stage06/test_readiness.py

      - name: Final Validation Aggregation
        run: |
          echo "=== Stage 06 Validation Aggregation ==="
          echo "All mandatory gates executed."
          echo "Deployment: BLOCKED until owner input received."
          echo "Evidence completeness: check semantic validator output."
